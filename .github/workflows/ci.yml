name: Build
on:
  push:
    branches:
      - source

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: false                        # ✅ 先不拉 submodule
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Fetch submodules with retry        # ✅ 加重试逻辑
      run: |
        git submodule sync --recursive
        for i in 1 2 3 4 5; do
          echo "Attempt $i..."
          git submodule update --init --recursive && break
          echo "Failed, retrying in 15s..."
          sleep 15
        done

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        cd ./Maverick
        python -m pip install --upgrade pip
        pip install -r prod_req.txt
        pip install pyyaml
        pip install "pytz==2023.3" --force-reinstall    # ✅ 放最后，加 --force-reinstall

    - name: Build site
      run: |
        cd ./Maverick
        python ./build.py -c "../conf.py"

    - name: Generate mp-articles-manifest for WeChat miniprogram
      run: |
        python ./tools/gen_mp_articles_manifest.py

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: ./dist
        allow_empty_commit: false
